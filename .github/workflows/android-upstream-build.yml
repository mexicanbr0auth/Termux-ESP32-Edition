name: Build upstream Termux app (reference)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref from termux/termux-app"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream Termux app
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: ${{ inputs.ref }}
          path: upstream-termux-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: upstream-termux-app
        run: ./gradlew assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: upstream-termux-debug-apk
          path: upstream-termux-app/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
