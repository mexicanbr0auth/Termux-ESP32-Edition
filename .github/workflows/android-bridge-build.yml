name: Build Android USB bridge

on:
  push:
    paths:
      - 'android-usb-bridge/**'
      - '.github/workflows/android-bridge-build.yml'
  pull_request:
    paths:
      - 'android-usb-bridge/**'
      - '.github/workflows/android-bridge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-usb-bridge
        run: gradle assembleDebug
      - name: Upload bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-esp32-usb-bridge-debug
          path: android-usb-bridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
